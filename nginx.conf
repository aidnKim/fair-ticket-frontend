# 1. HTTP (80번 포트) - 리다이렉트 전용
server {
    listen 80;
    server_name fairticket.store www.fairticket.store;

    # Certbot 인증용
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # 나머지는 다 HTTPS로 토스
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS (443번 포트) - 실제 서비스
server {
    listen 443 ssl;
    server_name fairticket.store www.fairticket.store;

    # SSL 인증서 경로 (Docker Volume으로 연결된 경로)
    # 주의: 도메인 이름 폴더가 맞는지 확인 필요 (보통 도메인명으로 생김)
    ssl_certificate /etc/letsencrypt/live/fairticket.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fairticket.store/privkey.pem;

    # 3. 프론트엔드 정적 파일 (React/Vue 빌드 결과물)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;  # SPA 라우팅 필수 설정
    }

    # 4. WebSocket 연결 (/ws)
    location /ws {
        proxy_pass http://backend:8080;  # 도커 컴포즈 서비스명:포트
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 5. 백엔드 API 연결 (선택사항 - API 요청도 Nginx 탈 경우)
    # 만약 프론트에서 http://backend:8080 으로 직접 요청하면 필요 없음
    # 하지만 보통은 /api 로 묶어서 보냅니다.
    location /api {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}